stages:
    - build
    - deploy
    - sonar
    - report
variables:
    DOCKER_IMAGE: registry.h1euda.click/shopnow-gitlab/product-service:$CI_COMMIT_SHORT_SHA
    REGISTRY_URL: registry.h1euda.click
build:
    stage: build
    image: docker:20-dind
    variables:
        DOCKER_HOST: tcp://docker:2375
        DOCKER_DRIVER: overlay2
        DOCKER_TLS_CERTDIR: ""
    services:
    -   name: docker:20-dind
        alias: docker
        command: ["--tls=false"]
    script:
    -   docker build -t $DOCKER_IMAGE .
    - >
      SECRETS=$(curl -s --header "X-Vault-Token: $SHOPNOW_TOKEN"
      --request GET "https://vault.hidevops.online/v1/kv/data/shopnow/registry" | jq -r '.data.data')
    - REGISTRY_productNAME=$(echo $SECRETS | jq -r '.product')
    - REGISTRY_PASSWORD=$(echo $SECRETS | jq -r '.password')
    - REGISTRY_URL=$(echo $SECRETS | jq -r '.url')
    - docker login -u "$REGISTRY_productNAME" -p "$REGISTRY_PASSWORD" "$REGISTRY_URL"
    - docker push $DOCKER_IMAGE
    tags:
    -   runner-shared-1
deploy:
    stage: deploy
    image: bitnami/kubectl:latest
    script:
    -   kubectl set image deployment/product-service-deployment product-service=$DOCKER_IMAGE -n shopnow
    tags:
    -   runner-shared-1
    
sonarqube-check:
  stage: sonar
  image: maven:3.9.9-eclipse-temurin-17
  variables:
    SONAR_product_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  before_script:
    - echo "192.168.1.115 sonarqube.hidevops.online" >> /etc/hosts
    - apt-get update && apt-get install -y wget unzip jq
    - >
      SECRET=$(curl -s  --header "X-Vault-Token: $SONAR_TOKEN"   --request GET   https://vault.hidevops.online/v1/kv/data/sonar/secret | jq -r ".data.data")
    - export SONAR_HOST_URL=$(echo $SECRET | jq -r '.url')
    - export SONAR_TOKEN=$(echo $SECRET | jq -r '.token')
    - wget --tries=3 https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.1.0.4889-linux-x64.zip
    - unzip sonar-scanner-cli-7.1.0.4889-linux-x64.zip
    - mv sonar-scanner-7.1.0.4889-linux-x64 /opt/sonar-scanner
    - export PATH=$PATH:/opt/sonar-scanner/bin
  script:
    - mvn clean compile
    - sonar-scanner -Dsonar.java.binaries="./target/classes" -Dsonar.sources="./src/" -Dsonar.projectKey=${CI_PROJECT_NAME} -Dsonar.projectName="$CI_PROJECT_NAME" -Dsonar.projectVersion="${CI_COMMIT_SHORT_SHA}"
  allow_failure: true
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - ~/.m2/repository
  tags:
    - runner-shared-1


sonar-report:
  stage: report
  image: node:20
  before_script:
    - echo "192.168.1.115 sonarqube.hidevops.online" >> /etc/hosts
    - apt-get update && apt-get install -y chromium && apt-get install -y jq
    - npm install puppeteer
    - >
      SECRET=$(curl -s  --header "X-Vault-Token: $SONAR_TOKEN"   --request GET   https://vault.hidevops.online/v1/kv/data/sonar/secret | jq -r ".data.data")
    - export SONAR_HOST_URL=$(echo $SECRET | jq -r '.url')
    - export SONAR_TOKEN=$(echo $SECRET | jq -r '.token')
    - export SONAR_product=$(echo $SECRET | jq -r '.product')
    - export SONAR_PASSWORD=$(echo $SECRET | jq -r '.password')
  script:
    - |
      cat > screenshot.js << 'EOF'
      const puppeteer = require('puppeteer');

      (async () => {
        const projectId = process.env.CI_PROJECT_NAME;

        const browser = await puppeteer.launch({
          headless: true,
          args: ['--no-sandbox', '--disable-setuid-sandbox'],
          executablePath: '/usr/bin/chromium'
        });

        const page = await browser.newPage();
        await page.setViewport({ width: 1920, height: 1080});

        await page.goto(`${process.env.SONAR_HOST_URL}sessions/new?return_to=%2F`, {waitUntil: 'networkidle2'});

        await page.waitForSelector('#login-input', {timeout: 10000} );
        await page.type('#login-input', process.env.SONAR_USER);
        
        await page.waitForSelector('#password-input', {timeout: 10000});
        await page.type('#password-input', process.env.SONAR_PASSWORD);

        await Promise.all([
          page.click('button[type="submit"]'),
          page.waitForNavigation({ waitUntil: 'networkidle2' })
        ]);

        const issueUrl = `${process.env.SONAR_HOST_URL}project/issues?s=IMPACT_RANK&issueStatuses=CONFIRMED%2COPEN&id=${projectId}`;
        await page.goto(issueUrl, {waitUntil: 'networkidle2'});

        await page.screenshot({path: 'sonar-report.png', fullPage: true});

        await browser.close();
      })();
      EOF
    - node screenshot.js

    - >
      curl -s -X POST https://api.telegram.org/bot8920841500:AAGVfKfmeWa2F1EtC2DsJL2BIDi6SlhcIwk/sendPhoto
      -F chat_id=-5357300076
      -F photo=@sonar-report.png
      -F caption="SonarQube Report for *${CI_PROJECT_NAME}* (${CI_COMMIT_SHORT_SHA})"
      -F parse_mode=Markdown
  tags:
    - runner-shared-1    
