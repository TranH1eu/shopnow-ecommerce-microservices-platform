# Global settings
global:
  appName: "shopnow-frontend"       # Tên ứng dụng mặc định
  namespace: "shopnow"        # Namespace mặc định
  enabledComponents:
    configmap: false          # Bật/tắt ConfigMap
    service: true             # Bật/tắt Service
    ingress: true             # Bật/tắt Ingress

# Deployment
image:
  repository: "registry.h1euda.click/shopnow/shopnow-frontend"
  tag: "v6"
  pullPolicy: IfNotPresent
  pullSecret: "shopnow-registry-secret" # Secret để pull image từ private registry

replicaCount: 1
rollingUpdate:
  maxSurge: 25%
  maxUnavailable: 25%

# Service
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# Ingress (chỉ áp dụng nếu enabledComponents.ingress = true)
ingress:
  className: "nginx"
  host: "shopnow.hidevops.online.vn"
  path: "/"
  pathType: Prefix

# ConfigMap (chỉ áp dụng nếu enabledComponents.configmap = true)
configmap:
  data: {}
  # Ví dụ:
  # data:
  #   application.properties: |
  #     server.port=8080
  #     spring.datasource.url=jdbc:mysql://db-service:3306/mydb
